<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电力两票智能审核面板</title>
<style>
  :root {
    --ink: #1f2933; --muted: #616e7c; --line: #cbd2d9;
    --ok: #1b7f4d; --bad: #b3341f; --manual: #946200; --brand: #14406b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--ink); background: #f5f7fa; }
  header { background: var(--brand); color: #fff; padding: 18px 24px; }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; font-size: 12px; opacity: .85; }
  main { max-width: 980px; margin: 0 auto; padding: 16px 24px 48px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-top: 16px; }
  section[hidden] { display: none; }
  h2 { font-size: 16px; margin: 0 0 12px; color: var(--brand); border-left: 4px solid var(--brand); padding-left: 8px; }
  h3 { font-size: 14px; margin: 16px 0 8px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eef2f6; white-space: nowrap; }
  ul { margin: 6px 0; padding-left: 22px; font-size: 13px; }
  p { font-size: 13px; margin: 6px 0; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
  button.secondary { background: #52606d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=file] { font-size: 13px; }
  .chips { display: flex; gap: 10px; margin: 8px 0; }
  .chip { border-radius: 14px; padding: 3px 12px; font-size: 13px; color: #fff; }
  .chip.ok { background: var(--ok); } .chip.bad { background: var(--bad); } .chip.manual { background: var(--manual); }
  .v-ok { color: var(--ok); font-weight: 600; } .v-bad { color: var(--bad); font-weight: 600; } .v-manual { color: var(--manual); font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .status.err { color: var(--bad); }
  .meta-note { font-size: 12px; color: var(--muted); }
  .sec-report h4 { margin: 14px 0 4px; font-size: 14px; }
  .sec-report .r-title { font-size: 18px; font-weight: 700; text-align: center; margin: 8px 0; }
  .sec-report table { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>电力两票智能审核面板</h1>
  <p>规则优先 · 依据挂链 · 本页零外部资源，断网可用</p>
</header>
<main>
  <section>
    <h2>① 上传票据</h2>
    <div class="row">
      <input type="file" id="file" accept=".txt">
      <button id="btn-check">提交审核</button>
    </div>
    <div class="status" id="status-upload"></div>
  </section>

  <section id="sec-card" hidden>
    <h2>② 票面参数卡</h2>
    <div id="card-body"></div>
  </section>

  <section id="sec-concl" hidden>
    <h2>③ 校核结论</h2>
    <div id="concl-body"></div>
  </section>

  <section id="sec-report" hidden>
    <h2>④ 报告预览与导出</h2>
    <div class="row">
      <button id="btn-preview">生成报告预览</button>
      <button id="btn-download" class="secondary" disabled>下载 docx 报告</button>
    </div>
    <div class="status" id="status-report"></div>
    <div id="report-body" class="sec-report"></div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var currentFile = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function setStatus(el, text, isError) {
    el.textContent = text;
    el.className = isError ? "status err" : "status";
  }

  function postForm(url, file) {
    var fd = new FormData();
    fd.append("file", file, file.name);
    return fetch(url, { method: "POST", body: fd }).then(function (resp) {
      return resp.json().then(function (data) {
        if (!resp.ok) { throw new Error(data.error || ("请求失败（" + resp.status + "）")); }
        return data;
      });
    });
  }

  function verdictClass(v) {
    if (v === "合规") { return "v-ok"; }
    if (v === "不合规") { return "v-bad"; }
    return "v-manual";
  }

  function table(headers, rows) {
    var html = "<table><tr>";
    headers.forEach(function (h) { html += "<th>" + esc(h) + "</th>"; });
    html += "</tr>";
    rows.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c) { html += "<td>" + c + "</td>"; });
      html += "</tr>";
    });
    return html + "</table>";
  }

  function renderCard(data) {
    var card = data.card;
    var html = "<p><b>" + esc(card.ticket_type_name) + "</b>　编号：" + esc(
      card.fields.ticket_no ? card.fields.ticket_no.value : "（未提取到）"
    ) + "　来源：" + esc(data.filename) + "</p>";
    var rows = [];
    Object.keys(card.fields).forEach(function (k) {
      var fv = card.fields[k];
      rows.push([esc(k), esc(fv.value === null || fv.value === undefined ? "" : fv.value),
        esc(fv.evidence ? fv.evidence.quote : "—")]);
    });
    if (rows.length) { html += "<h3>字段</h3>" + table(["字段", "值", "原文摘录"], rows); }
    if (card.operation_sequence && card.operation_sequence.length) {
      html += "<h3>操作序列（" + card.operation_sequence.length + " 项）</h3>" + table(
        ["步骤", "操作内容"],
        card.operation_sequence.map(function (s) { return [esc(s.no), esc(s.action)]; })
      );
    }
    if (card.safety_measures && card.safety_measures.length) {
      html += "<h3>安全措施（" + card.safety_measures.length + " 条）</h3>" + table(
        ["条目", "内容"],
        card.safety_measures.map(function (m) { return [esc(m.no), esc(m.text)]; })
      );
    }
    if (data.warnings && data.warnings.length) {
      html += "<h3>解析告警</h3><ul>" + data.warnings.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>";
    }
    $("card-body").innerHTML = html;
  }

  function renderConclusions(data) {
    var s = data.summary;
    var html = '<div class="chips">' +
      '<span class="chip ok">合规 ' + s["合规"] + '</span>' +
      '<span class="chip bad">不合规 ' + s["不合规"] + '</span>' +
      '<span class="chip manual">待人工确认 ' + s["待人工确认"] + '</span></div>';
    html += table(
      ["规则编号", "规则名称", "判定", "风险", "依据", "证据（首条）"],
      data.conclusions.map(function (c) {
        var basis = c.basis ? (c.basis.standard + " " + (c.basis.clause || "") + "（" + (c.basis.status || "") + "）") : "—";
        return [esc(c.rule_id), esc(c.name),
          '<span class="' + verdictClass(c.verdict) + '">' + esc(c.verdict) + '</span>',
          esc(c.risk || "—"), esc(basis), esc(c.evidence && c.evidence.length ? c.evidence[0] : "—")];
      })
    );
    $("concl-body").innerHTML = html;
  }

  function renderReportPreview(data) {
    var html = '<div class="r-title">报告预览（与 docx 导出同源）</div>';
    data.sections.forEach(function (sec) {
      if (sec.kind === "title") { html += '<div class="r-title">' + esc(sec.text) + '</div>'; }
      else if (sec.kind === "meta_table") { html += table(["项目", "内容"], sec.rows.map(function (r) { return [esc(r[0]), esc(r[1])]; })); }
      else if (sec.kind === "heading") { html += (sec.level === 1 ? "<h3>" : "<h4>") + esc(sec.text) + (sec.level === 1 ? "</h3>" : "</h4>"); }
      else if (sec.kind === "paragraph") { html += "<p>" + esc(sec.text) + "</p>"; }
      else if (sec.kind === "bullets") { html += "<ul>" + sec.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>"; }
      else if (sec.kind === "table") { html += table(sec.header, sec.rows.map(function (r) { return r.map(esc); })); }
    });
    $("report-body").innerHTML = html;
  }

  $("btn-check").addEventListener("click", function () {
    var file = $("file").files[0];
    if (!file) { setStatus($("status-upload"), "请先选择 .txt 票据文件", true); return; }
    currentFile = file;
    setStatus($("status-upload"), "审核中……");
    postForm("/api/check", file).then(function (data) {
      renderCard(data);
      renderConclusions(data);
      $("sec-card").hidden = false;
      $("sec-concl").hidden = false;
      $("sec-report").hidden = false;
      $("report-body").innerHTML = "";
      $("btn-download").disabled = false;
      var s = data.summary;
      setStatus($("status-upload"), "审核完成：合规 " + s["合规"] + " / 不合规 " + s["不合规"] + " / 待人工确认 " + s["待人工确认"]);
    }).catch(function (e) { setStatus($("status-upload"), e.message, true); });
  });

  $("btn-preview").addEventListener("click", function () {
    if (!currentFile) { return; }
    setStatus($("status-report"), "生成预览中……");
    postForm("/api/report-preview", currentFile).then(function (data) {
      renderReportPreview(data);
      setStatus($("status-report"), "预览已生成（预览与 docx 导出同一章节结构）。");
    }).catch(function (e) { setStatus($("status-report"), e.message, true); });
  });

  $("btn-download").addEventListener("click", function () {
    if (!currentFile) { return; }
    setStatus($("status-report"), "导出 docx 中……");
    var fd = new FormData();
    fd.append("file", currentFile, currentFile.name);
    fetch("/api/report", { method: "POST", body: fd }).then(function (resp) {
      if (!resp.ok) {
        return resp.json().then(function (data) { throw new Error(data.error || "导出失败"); });
      }
      return resp.blob();
    }).then(function (blob) {
      var name = currentFile.name.replace(/\.[^.]+$/, "") + "-审核报告.docx";
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(a.href);
      a.remove();
      setStatus($("status-report"), "已下载：" + name);
    }).catch(function (e) { setStatus($("status-report"), e.message, true); });
  });
})();
</script>
</body>
</html>
