[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "power-operation-ticket-checker"
version = "0.1.0"
description = "电力'两票'（工作票/操作票）智能审核与合规校核系统：规则优先、依据挂链、基准可复现"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["power", "safety", "work-ticket", "operation-ticket", "compliance", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Scientific/Engineering",
]
# 依赖分层（plan/03 §3）：core 零三方依赖；extras 必须覆盖运行期与测试期真实 import
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.20", "python-multipart>=0.0.5"]
report = ["python-docx>=0.8.11"]
llm = ["openai>=1.0"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
powerticket = "powerticket.cli:main"

[tool.setuptools.packages.find]
include = ["powerticket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不要在这里放 "-q"：命令行再加 -q 会叠加成 -qq，把 pytest 的「N passed」汇总行整行吞掉
# （2026-10-22 二次迭代踩过）。这里只关掉 cacheprovider，避免仓库里留 .pytest_cache。
addopts = "-p no:cacheprovider"
