name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          # 3.8 保障开发机基线（ubuntu-24.04 无 3.8 构建，固定 22.04）
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: windows-latest, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # dev 提供 pytest/httpx（TestClient）；web/report 使对应测试不被 importorskip 静默跳过
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,report]"
      - name: Test
        run: python -X utf8 -m pytest
