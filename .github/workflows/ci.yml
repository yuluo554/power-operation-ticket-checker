name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # dev 提供 pytest/httpx（TestClient）；web/report 使对应测试不被 importorskip 静默跳过
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,report]"
      - name: Test
        run: python -X utf8 -m pytest
      - name: Sample reproducibility gate
        # 位级复现门：样例集必须能由 generate.py 逐字节重建（不写盘，只对账）
        run: python -X utf8 data/generator/generate.py --check
